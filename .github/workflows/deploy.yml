# Deploy the static Vite build to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Do not interrupt a main publication after it has started.
  cancel-in-progress: false

jobs:
  # Pull requests and deployments call the same source-running gate. The gate
  # receives read-only repository authority; Pages and OIDC write authority is
  # isolated to the no-checkout deploy job below.
  build:
    uses: ./.github/workflows/browser-gate.yml
    with:
      upload_pages_artifact: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
