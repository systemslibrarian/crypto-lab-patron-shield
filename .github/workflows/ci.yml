name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:workflow
      - run: npm test
      - run: npm run build

  # The same reusable gate that produces the deploy artifact must pass before a
  # dependency update can merge itself.
  browser-gate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-gate.yml

  dependabot-auto-merge:
    needs: [test, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Leave major updates for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo 'Major update left open for human review.'
      - name: Reject an unrecognized Dependabot update type
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: exit 1
      - name: Merge a gated patch or minor update
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          merged=false
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              state="$(gh pr view "$PR_URL" --json state --jq .state)"
              if [ "$state" = MERGED ]; then
                merged=true
                break
              fi
            fi
            echo "merge attempt $attempt did not land; retrying after the base branch settles"
            sleep 15
          done
          if [ "$merged" != true ]; then
            echo "::error::gate passed, but the Dependabot PR did not merge after 3 attempts"
            exit 1
          fi
          if ! gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            echo "::error::merge landed, but the required deploy workflow did not dispatch"
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
